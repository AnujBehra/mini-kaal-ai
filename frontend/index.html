<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAAL AI Guidance App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>KAAL AI Guidance App</h1>
      <p class="subtitle">Ask a question and receive guidance</p>
    </header>

    <!-- Main Content Grid -->
    <main class="main-grid">
      <!-- Left Column: Question Form & Current Response -->
      <section class="left-col">
        <div class="card">
          <h2>Ask a Question</h2>
          <form id="question-form">
            <label for="question-input">Your Question:</label>
            <textarea
              id="question-input"
              rows="3"
              placeholder="Type your question here... (e.g., How do I prepare for a junior developer interview?)"
            ></textarea>

            <!-- Error message container -->
            <div id="error-box" class="error-box" style="display: none;"></div>

            <!-- Submit button -->
            <button type="submit" id="submit-btn" class="btn-primary">
              Submit Question
            </button>
          </form>
        </div>

        <!-- Loading state -->
        <div id="loading-box" class="card loading-card" style="display: none;">
          <div class="spinner"></div>
          <p>Generating guidance, please wait...</p>
        </div>

        <!-- Latest Guidance Response -->
        <div id="response-box" class="card response-card" style="display: none;">
          <div class="tag">Latest Response</div>
          <h3 id="response-question"></h3>
          <p id="response-text" class="response-text"></p>
          <span id="response-time" class="timestamp"></span>
        </div>
      </section>

      <!-- Right Column: History List -->
      <section class="right-col">
        <div class="card history-card">
          <h2>Previous Questions &amp; Responses</h2>
          <div id="history-list" class="history-list">
            <p class="empty-state">Loading history...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Mini KAAL AI Guidance App &bull; HTML + CSS + JavaScript + Node.js + PostgreSQL</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
