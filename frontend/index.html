<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAAL AI Guidance App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>KAAL AI Guidance App</h1>
      <p>Ask a question and receive guidance</p>
    </header>

    <!-- Main Content -->
    <div class="main-grid">
      <!-- Left Column: Ask Form and Response -->
      <div class="left-col">
        <div class="card">
          <h2>Ask a Question</h2>
          <form id="question-form">
            <div class="form-group">
              <label for="question-input">Your Question:</label>
              <textarea
                id="question-input"
                rows="3"
                placeholder="Enter your question here..."
              ></textarea>
            </div>

            <!-- Error message -->
            <div id="error-box" class="error-box" style="display: none;"></div>

            <!-- Submit button -->
            <button type="submit" id="submit-btn" class="btn-submit">Submit Question</button>
          </form>
        </div>

        <!-- Loading indicator -->
        <div id="loading-box" class="card loading-box" style="display: none;">
          <p>Generating response, please wait...</p>
        </div>

        <!-- Response display area -->
        <div id="response-box" class="card" style="display: none;">
          <h2>Latest Response</h2>
          <p><strong>Question:</strong> <span id="response-question"></span></p>
          <p style="margin-top: 8px;"><strong>Guidance:</strong></p>
          <p id="response-text" class="response-text"></p>
          <span id="response-time" class="timestamp"></span>
        </div>
      </div>

      <!-- Right Column: History -->
      <div class="right-col">
        <div class="card">
          <h2>Previous Questions &amp; Responses</h2>
          <div id="history-list" class="history-list">
            <p class="empty-state">Loading history...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <p>Mini KAAL AI Guidance App</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
